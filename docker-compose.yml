# Runs only the app. MongoDB is the existing shared instance, configured
# through MONGODB_URI in docker.env (see docker.env.example).
services:
  app:
    build: .
    image: email-app:latest
    container_name: email-app
    env_file: docker.env
    ports:
      - "30213:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
